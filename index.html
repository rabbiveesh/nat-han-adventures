<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Nat Han Adventures</title>
    <link data-trunk rel="rust" data-bin="nat-han-adventures" data-cargo-no-default-features data-cargo-profile-release="wasm-release" data-wasm-opt="z" />
    <script>
      // Autoplay policy: an AudioContext made before any user gesture starts suspended.
      // Remember every context the game creates and resume them on the first click / key.
      (function () {
        const Orig = window.AudioContext || window.webkitAudioContext;
        if (!Orig) return;
        const contexts = [];
        window.AudioContext = window.webkitAudioContext = new Proxy(Orig, {
          construct(target, args) { const c = new target(...args); contexts.push(c); return c; },
        });
        const resume = () => contexts.forEach((c) => { if (c.state !== "running") c.resume(); });
        for (const ev of ["pointerdown", "keydown", "touchend"]) document.addEventListener(ev, resume, true);
      })();
    </script>
    <style>
      html, body { margin: 0; height: 100%; background: #1a120c; overflow: hidden; }
      canvas#game { width: 100%; height: 100%; display: block; outline: none; image-rendering: pixelated; }
      #start {
        position: fixed; inset: 0; display: grid; place-items: center; cursor: pointer;
        background: #1a120c; color: #ffc72e; text-align: center;
        font: bold 20px/1.6 ui-monospace, monospace; letter-spacing: 2px;
      }
      #start small { display: block; color: #b39a7a; font-size: 14px; font-weight: normal; }

      /* Touch controls: phones only (see `isPhone` below; `?touch=1` / `?touch=0` overrides).
         The small buttons sit just under the HUD row (nuggets / level / timer).
         The left side is an invisible floating stick (thumb down anywhere, slide left/right);
         the right side is one big jump zone. Labels fade once you've started playing. */
      body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      #touch { display: none; position: fixed; inset: 0; pointer-events: none; z-index: 5;
        font: bold 13px ui-monospace, monospace; color: rgba(255, 238, 200, 0.7); }
      body.touch #touch { display: block; }
      .zone { position: absolute; pointer-events: auto; touch-action: none; }
      #stick-zone { left: 0; top: 96px; bottom: 0; width: 45%; }
      #jump-zone { right: 0; top: 96px; bottom: 0; width: 45%; }
      .hint { position: absolute; bottom: 18px; padding: 6px 10px; border-radius: 10px;
        border: 2px dashed rgba(255, 199, 46, 0.4); transition: opacity 1.2s; }
      #stick-zone .hint { left: 18px; } #jump-zone .hint { right: 18px; }
      body.played .hint { opacity: 0; }
      #ring { position: fixed; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%;
        border: 2px solid rgba(255, 199, 46, 0.6); display: none; pointer-events: none; z-index: 6; }
      #ring::after { content: ""; position: absolute; left: 50%; top: 50%; width: 22px; height: 22px;
        margin: -11px; border-radius: 50%; background: rgba(255, 199, 46, 0.55); transform: translateX(var(--dx, 0px)); }
      .btn { position: absolute; pointer-events: auto; touch-action: none; top: 46px; height: 36px; min-width: 44px;
        display: grid; place-items: center; padding: 0 8px; box-sizing: border-box; border-radius: 10px;
        border: 2px solid rgba(255, 199, 46, 0.45); background: rgba(26, 18, 12, 0.35); }
      .btn.down { background: rgba(255, 199, 46, 0.35); }
      #pause { right: max(12px, env(safe-area-inset-right)); }
      #ok { right: calc(max(12px, env(safe-area-inset-right)) + 56px); }
      #up { left: max(12px, env(safe-area-inset-left)); }
      #down { left: calc(max(12px, env(safe-area-inset-left)) + 56px); }

      /* Phones held upright: nudge toward landscape (dismissable). */
      #rotate { display: none; position: fixed; inset: 0; z-index: 20; background: #1a120c; color: #ffc72e;
        place-items: center; text-align: center; font: bold 18px/1.6 ui-monospace, monospace; padding: 24px; }
      #rotate small { display: block; color: #b39a7a; font-weight: normal; font-size: 14px; margin-top: 12px; }
      #rotate .phone { width: 44px; height: 76px; border: 4px solid #ffc72e; border-radius: 10px; margin: 0 auto 20px;
        animation: tilt 2.2s ease-in-out infinite; }
      @keyframes tilt { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
      @media (orientation: portrait) { body.touch:not(.portrait-ok) #rotate { display: grid; } }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="0"></canvas>
    <div id="start">
      <div>
        <span id="start-msg">loading&hellip;</span>
        <small id="start-help">arrows to move &middot; space to jump (twice to toot) &middot; esc to pause</small>
      </div>
    </div>
    <div id="touch" aria-hidden="true">
      <div class="zone" id="stick-zone"><span class="hint">&#9664; slide &#9654;</span></div>
      <div class="zone" id="jump-zone" data-key="Space"><span class="hint">tap: JUMP &middot; again: TOOT</span></div>
      <div class="btn" id="up" data-key="ArrowUp">&#9650;</div>
      <div class="btn" id="down" data-key="ArrowDown">&#9660;</div>
      <div class="btn" id="ok" data-key="Enter">OK</div>
      <div class="btn" id="pause" data-key="Escape">II</div>
    </div>
    <div id="ring"></div>
    <div id="rotate" role="dialog" aria-label="Rotate your phone">
      <div>
        <div class="phone"></div>
        turn your phone sideways
        <small>Nat needs room to run. <u id="portrait-ok">play upright anyway</u></small>
      </div>
    </div>
    <script>
      // Browsers only allow audio after a user gesture: an overlay asks for a click or key,
      // then gets out of the way and gives the canvas keyboard focus.
      const canvas = document.getElementById("game");
      const start = document.getElementById("start");
      const msg = document.getElementById("start-msg");
      let ready = false;
      new ResizeObserver(() => {
        if (!ready && canvas.width > 0) { ready = true; msg.textContent = "click or press any key to start"; }
      }).observe(canvas);
      function go(e) {
        if (!ready) return;
        if (e) e.preventDefault();
        start.remove();
        canvas.focus();
        window.removeEventListener("keydown", go);
      }
      start.addEventListener("pointerdown", go);
      window.addEventListener("keydown", go);
      canvas.addEventListener("pointerdown", () => canvas.focus());

      // Touch controls: each button presses the game's ordinary key on the canvas (winit reads
      // keydown/keyup there), so menus and gameplay work unchanged. Multi-touch via pointer
      // events; the d-pad follows the finger, so sliding from left to right switches keys.
      // Phones only: a touch-only device (no mouse/trackpad at all, can't hover) with a small
      // screen. Touchscreen laptops have a fine pointer, so they keep the keyboard UI.
      // `?touch=1` / `?touch=0` in the URL forces it either way (testing).
      const forced = new URLSearchParams(location.search).get("touch");
      const isPhone =
        matchMedia("(pointer: coarse)").matches &&
        !matchMedia("(any-pointer: fine)").matches &&
        matchMedia("(hover: none)").matches &&
        Math.min(screen.width, screen.height) <= 600;
      const touchy = forced === null ? isPhone : forced === "1";
      if (touchy) {
        document.body.classList.add("touch");
        document.getElementById("start-help").textContent =
          "tap to start \u00b7 hold sideways \u00b7 JUMP twice to toot";
      }
      document.getElementById("portrait-ok").addEventListener("pointerdown", (e) => {
        e.stopPropagation();
        document.body.classList.add("portrait-ok");
      });
      const CODES = { ArrowLeft: "ArrowLeft", ArrowRight: "ArrowRight", ArrowUp: "ArrowUp", ArrowDown: "ArrowDown",
        Space: " ", Enter: "Enter", Escape: "Escape" };
      const held = new Map(); // code -> number of pointers holding it
      function key(type, code) {
        canvas.dispatchEvent(new KeyboardEvent(type, { key: CODES[code], code, bubbles: true, cancelable: true }));
      }
      function press(code) { const n = held.get(code) || 0; held.set(code, n + 1); if (n === 0) key("keydown", code); }
      function release(code) { const n = held.get(code) || 0; if (n <= 1) { held.delete(code); if (n === 1) key("keyup", code); } else held.set(code, n - 1); }
      let fadeTimer = null;
      function played() { if (!fadeTimer) fadeTimer = setTimeout(() => document.body.classList.add("played"), 6000); }
      // Anything that holds one key while touched (the jump zone, the small top buttons).
      function button(el, code) {
        const active = new Set();
        el.addEventListener("pointerdown", (e) => {
          e.preventDefault(); el.setPointerCapture(e.pointerId); active.add(e.pointerId);
          el.classList.add("down"); canvas.focus(); press(code); played();
        });
        const up = (e) => {
          if (!active.delete(e.pointerId)) return;
          if (active.size === 0) el.classList.remove("down");
          release(code);
        };
        for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) el.addEventListener(ev, up);
      }
      for (const el of document.querySelectorAll("#touch [data-key]")) button(el, el.dataset.key);
      // The floating stick: thumb down anywhere on the left; sliding past a small dead zone from
      // where it landed holds left or right. The origin follows a thumb that drifts far.
      const zone = document.getElementById("stick-zone");
      const ring = document.getElementById("ring");
      const DEAD = 10, MAX = 28;
      const sticks = new Map(); // pointerId -> { x0, y0, code }
      function aim(e) {
        const st = sticks.get(e.pointerId);
        let dx = e.clientX - st.x0;
        if (Math.abs(dx) > MAX) { st.x0 = e.clientX - Math.sign(dx) * MAX; dx = Math.sign(dx) * MAX; }
        const code = dx > DEAD ? "ArrowRight" : dx < -DEAD ? "ArrowLeft" : null;
        if (code !== st.code) { if (st.code) release(st.code); if (code) press(code); st.code = code; }
        ring.style.left = st.x0 + "px"; ring.style.top = st.y0 + "px";
        ring.style.setProperty("--dx", dx + "px");
      }
      zone.addEventListener("pointerdown", (e) => {
        e.preventDefault(); zone.setPointerCapture(e.pointerId); canvas.focus(); played();
        sticks.set(e.pointerId, { x0: e.clientX, y0: e.clientY, code: null });
        ring.style.display = "block"; aim(e);
      });
      zone.addEventListener("pointermove", (e) => { if (sticks.has(e.pointerId)) aim(e); });
      for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) {
        zone.addEventListener(ev, (e) => {
          const st = sticks.get(e.pointerId);
          if (!st) return;
          sticks.delete(e.pointerId);
          if (st.code) release(st.code);
          if (sticks.size === 0) ring.style.display = "none";
        });
      }
      // Never leave a key stuck if the page loses focus mid-touch.
      window.addEventListener("blur", () => { for (const code of [...held.keys()]) { held.set(code, 1); release(code); } sticks.clear(); ring.style.display = "none"; });
      document.addEventListener("contextmenu", (e) => { if (touchy) e.preventDefault(); });
    </script>
  </body>
</html>
