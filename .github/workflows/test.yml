name: Test

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libasound2-dev libwayland-dev libxkbcommon-dev
      # Installs exactly what rust-toolchain.toml pins (rustup no longer auto-installs).
      - name: Install Rust
        run: rustup toolchain install
      # .cargo/config.toml links with clang + mold.
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # Test binaries run in parallel (see .config/nextest.toml for the serial timing group).
      - name: Headless gameplay tests
        run: cargo nextest run --profile ci
      # nextest doesn't run doctests.
      - name: Doctests
        run: cargo test --doc
