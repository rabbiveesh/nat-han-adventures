name: Release bandstand

# Two ways in. Pushing a `bandstand-v*` tag releases that tag. Merging a version
# bump of crates/bandstand to main releases it too: the `tag` job sees a version
# with no tag yet and creates it with this run's GITHUB_TOKEN. A tag made by
# GITHUB_TOKEN starts no new workflow run, so this same run carries on with the
# release and nothing fires twice; every other push to main stops at the `tag` job.
#
# crates.io Trusted Publishing, set up once (after the first publish by hand):
# bandstand -> Settings -> Trusted Publishing -> GitHub, repository
# rabbiveesh/nat-han-adventures, workflow release-bandstand.yml.
on:
  push:
    branches: [main]
    tags: ["bandstand-v*"]

permissions:
  contents: write
  id-token: write  # needed for crates.io Trusted Publishing

concurrency:
  group: release-bandstand
  cancel-in-progress: false

jobs:
  tag:
    name: Decide the release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # Cargo.lock agrees, and crates/bandstand/CHANGELOG.md has the section the
      # release body comes from. A bump that missed one stops here.
      - name: Version strings agree
        run: scripts/bandstand/check-version.sh --release

      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#bandstand-}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/bandstand/Cargo.toml | head -1)
          TAG="bandstand-v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists; nothing to release."
            exit 0
          fi
          # Losing a race to a concurrent run (or a hand-pushed tag) leaves the
          # tag in place, and that run or push does the release.
          if ! gh api "repos/$GITHUB_REPOSITORY/git/refs" \
                 -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null; then
            echo "Could not create $TAG (already created elsewhere?); not releasing from this run."
            exit 0
          fi
          echo "Created $TAG at $GITHUB_SHA."
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"

  publish-crate:
    name: Publish to crates.io
    needs: tag
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - name: Install Rust
        run: rustup toolchain install

      - name: Validate version matches tag
        run: |
          CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/bandstand/Cargo.toml | head -1)
          TAG_VERSION=${{ needs.tag.outputs.version }}
          if [ "v$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: crates/bandstand/Cargo.toml version ($CARGO_VERSION) != tag ($TAG_VERSION)"
            exit 1
          fi

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish to crates.io
        run: cargo publish -p bandstand || echo "Already published (idempotent)"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # The GitHub Release with hand-curated notes (this version's section of
  # crates/bandstand/CHANGELOG.md), followed by GitHub's generated commit list.
  release-notes:
    name: Release notes
    needs: [tag, publish-crate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - name: Extract CHANGELOG section for this version
        # Shared with the local preview (`scripts/bandstand/release-notes.sh v0.1.0`).
        run: scripts/bandstand/release-notes.sh "${{ needs.tag.outputs.version }}" > RELEASE_NOTES.md

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          name: bandstand ${{ needs.tag.outputs.version }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
