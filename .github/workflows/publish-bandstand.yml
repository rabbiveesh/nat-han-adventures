# Publishes the music engine (crates/bandstand) to crates.io whenever a push to main carries a
# version crates.io doesn't have yet: bump `version` in crates/bandstand/Cargo.toml, merge, and
# it releases (and tags `bandstand-v<version>`). Trusted publishing: no API token is stored
# here. Set up once on crates.io: bandstand -> Settings -> Trusted Publishing -> GitHub,
# repository rabbiveesh/nat-han-adventures, workflow publish-bandstand.yml, environment crates-io.
name: publish bandstand

on:
  push:
    branches: [main]
    paths: ["crates/bandstand/Cargo.toml"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Is this version on crates.io?
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/bandstand/Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          code=$(curl -s -o /dev/null -w '%{http_code}' -A 'nat-han-adventures release check (github.com/rabbiveesh/nat-han-adventures)' \
            "https://crates.io/api/v1/crates/bandstand/$version")
          if [ "$code" = 404 ]; then echo "new=true" >> "$GITHUB_OUTPUT"; else echo "new=false" >> "$GITHUB_OUTPUT"; fi
          echo "bandstand $version: crates.io says $code"

  publish:
    needs: check
    if: needs.check.outputs.new == 'true'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish -p bandstand
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Tag the release
        run: |
          git tag "bandstand-v${{ needs.check.outputs.version }}"
          git push origin "bandstand-v${{ needs.check.outputs.version }}"
