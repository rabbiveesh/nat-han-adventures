# Publishes the music engine (crates/bandstand) to crates.io when a `bandstand-v*` tag is
# pushed, through crates.io trusted publishing: no API token is stored here. Set up once on
# crates.io: bandstand -> Settings -> Trusted Publishing -> GitHub, repository
# rabbiveesh/nat-han-adventures, workflow publish-bandstand.yml, environment crates-io.
name: publish bandstand

on:
  push:
    tags: ["bandstand-v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish -p bandstand
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
