[package]
name = "nat-han-adventures"
version = "0.1.0"
edition = "2024"
# `cargo run` is the game; the music editor is `cargo run --bin editor`.
default-run = "nat-han-adventures"

[dependencies]
# bevy_audio is off: our chiptune synth plays straight through kira (one manager: the live
# music engine is a custom `Sound`, the sfx are static sounds). Inputs reach the audio thread
# over a lock-free ring buffer.
bevy = { version = "0.19.1", default-features = false, features = ["2d", "ui", "default_font"] }
kira = { version = "0.12", default-features = false, features = ["cpal"] }
rtrb = "0.4"
leafwing-input-manager = "0.21"
rand = "0.9"
bevy_brp_extras = { version = "0.22", optional = true }
# The music editor's GUI (native only, see the `editor` feature).
bevy_egui = { version = "0.40", optional = true, default-features = false, features = ["render", "default_fonts", "manage_clipboard"] }

[features]
default = ["dev"]
# Fast iteration: dynamically link bevy (and build the music editor). Disable for release
# builds (`--no-default-features`).
dev = ["bevy/dynamic_linking", "brp", "editor", "capture"]
# Bevy Remote Protocol (+ extras: screenshots, key input) so tools/agents can drive the game.
brp = ["dep:bevy_brp_extras", "bevy/png"]
# The native music editor (`src/bin/editor`, `cargo run --bin editor`): egui on the game's
# Bevy. The game binary never links it; the web build (`--no-default-features`) never builds it.
editor = ["dep:bevy_egui", "bevy/png"]
# Deterministic video capture (`NATHAN_CAPTURE=<dir>`, `scripts/record-run --capture`): game
# time steps a frame per update, every frame saved, the audio rendered in lockstep into a WAV.
# Native dev only.
capture = ["bevy/png"]

[[bin]]
name = "editor"
path = "src/bin/editor/main.rs"
required-features = ["editor"]

# Optimise deps even in dev; our own crate stays fast to compile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# wasm: getrandom needs to be told to use the browser's crypto API.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
web-sys = { version = "0.3", features = ["Window", "Storage", "Document", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "HtmlElement", "DomTokenList"] }
js-sys = "0.3"
wasm-bindgen = "0.2"

# Web release: small and fast. Used by Trunk (see index.html).
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "debuginfo"

[dev-dependencies]
# examples/sprite_sheet.rs writes a PNG contact sheet of all the art.
png = "0.18"
# examples/render_audio.rs writes the synth's output to WAV files for listening.
hound = "3.5"
